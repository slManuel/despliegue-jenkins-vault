apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault-secrets-operator-system
namePrefix: vault-secrets-operator-
resources:
  - upstream/config/crd
  - upstream/config/rbac
  - upstream/config/manager
images:
  - name: controller
    newName: hashicorp/vault-secrets-operator
    newTag: 1.6.0
patches:
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/name
        value: vault-secrets-operator-system
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/seccompProfile
        value: {type: RuntimeDefault}
      - op: add
        path: /spec/template/spec/containers/0/securityContext/capabilities
        value: {drop: [ALL]}
