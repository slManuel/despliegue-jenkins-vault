apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: csi
resources:
  - upstream.yaml
patches:
  - target:
      kind: DaemonSet
      name: vault-csi-provider
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: vault-ca
          mountPath: /etc/vault-ca
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: vault-ca
          configMap:
            name: vault-ca
