apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc
  namespace: jenkins
data:
  jenkins.yaml: |
    jenkins:
      systemMessage: 'Prueba DevOps: deployment separado de development'
      numExecutors: 0
      mode: EXCLUSIVE
      securityRealm:
        local:
          allowsSignup: false
          users:
          - id: ${JENKINS_ADMIN_ID}
            password: ${JENKINS_ADMIN_PASSWORD}
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousRead: false
      clouds:
      - kubernetes:
          name: kubernetes
          serverUrl: https://kubernetes.default.svc
          namespace: jenkins
          jenkinsUrl: http://jenkins.jenkins.svc.cluster.local:8080
          webSocket: true
    unclassified:
      location:
        url: http://jenkins.jenkins.svc.cluster.local:8080/
    security:
      scriptApproval:
        approvedSignatures: []
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector:
    app: jenkins
  ports:
  - name: http
    port: 8080
    targetPort: http
