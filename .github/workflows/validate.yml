name: Validate manifests and images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        type: boolean
        default: false
        description: Publish controller and agent images to private GHCR packages
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sh scripts/validate.sh
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          docker build -t ghcr.io/slmanuel/jenkins-controller:$GITHUB_SHA images/jenkins
          docker build -t ghcr.io/slmanuel/jenkins-agent:$GITHUB_SHA images/agent
      - name: Publish requested images
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/slmanuel/jenkins-controller:$GITHUB_SHA
          docker push ghcr.io/slmanuel/jenkins-agent:$GITHUB_SHA
          docker logout ghcr.io
