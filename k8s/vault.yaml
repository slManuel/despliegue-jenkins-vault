apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  server.hcl: |
    ui = true
    disable_mlock = true
    api_addr = "https://vault.vault.svc.cluster.local:8200"
    cluster_addr = "https://vault-0.vault-internal.vault.svc.cluster.local:8201"
    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file = "/vault/tls/tls.key"
    }
    storage "raft" {
      path = "/vault/data"
      node_id = "vault-0"
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault-internal
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      nodeSelector:
        workload: vault
      securityContext:
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: hashicorp/vault:2.1.2
          command: [vault, server, '-config=/vault/config/server.hcl']
          env:
            - name: VAULT_ADDR
              value: https://vault.vault.svc.cluster.local:8200
            - name: VAULT_CACERT
              value: /vault/tls/ca.crt
          ports:
            - name: api
              containerPort: 8200
            - name: cluster
              containerPort: 8201
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: api
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
              port: api
              scheme: HTTPS
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /vault/data
            - name: config
              mountPath: /vault/config
              readOnly: true
            - name: tls
              mountPath: /vault/tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vault-data
        - name: config
          configMap:
            name: vault-config
        - name: tls
          secret:
            secretName: vault-tls
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: vault
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: vault
  ports:
    - name: api
      port: 8200
    - name: cluster
      port: 8201
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app: vault
  ports:
    - name: api
      port: 8200
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: vault-private
  namespace: vault
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-internal: 'true'
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
spec:
  type: LoadBalancer
  loadBalancerSourceRanges: [10.0.0.0/16]
  selector:
    app: vault
  ports:
    - name: api
      port: 8200
      targetPort: api
