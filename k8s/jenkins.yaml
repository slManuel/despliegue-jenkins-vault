apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc
  namespace: jenkins
data:
  jenkins.yaml: "jenkins:\n  systemMessage: \"Prueba DevOps: deployment separado de\
    \ development\"\n  numExecutors: 0\n  mode: EXCLUSIVE\n  securityRealm:\n    local:\n\
    \      allowsSignup: false\n      users:\n        - id: \"${JENKINS_ADMIN_ID}\"\
    \n          password: \"${JENKINS_ADMIN_PASSWORD}\"\n  authorizationStrategy:\n\
    \    loggedInUsersCanDoAnything:\n      allowAnonymousRead: false\n  clouds:\n\
    \    - kubernetes:\n        name: kubernetes\n        serverUrl: https://kubernetes.default.svc\n\
    \        namespace: jenkins\n        jenkinsUrl: http://jenkins.jenkins.svc.cluster.local:8080\n\
    \        webSocket: true\nunclassified:\n  location:\n    url: http://jenkins.jenkins.svc.cluster.local:8080/\n\
    security:\n  scriptApproval:\n    approvedSignatures: []\n"
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  selector:
    app: jenkins
  ports:
  - name: http
    port: 8080
    targetPort: http
